<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mate XI — Spațiul tău de învățare</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div class="logo">∑</div>
        <span>Mate<span style="color: #a8a3ff">XI</span></span>
      </div>
      <div class="tag">Clasa a XI-a · M1</div>
    </header>

    <section class="hero">
      <h1>Matematica, <span>mai simplă.</span></h1>
  
    </section>

    <nav class="tabs" role="tablist" aria-label="Secțiuni">
      <button class="tab" role="tab" id="tab-theory" aria-controls="panel" aria-selected="true" data-tab="theory">
        ▤ &nbsp; Teorie
      </button>
      <button class="tab" role="tab" id="tab-help" aria-controls="panel" aria-selected="false" data-tab="help">
        ◇ &nbsp; Ajutor la probleme
      </button>
    </nav>

    <section class="panel" id="panel" role="tabpanel" aria-labelledby="tab-theory">
      <div>
        <div class="empty-icon" id="panel-icon">▤</div>
        <h2 id="panel-title">Teorie</h2>
        <p id="panel-desc">Aici vor apărea lecțiile, conceptele și explicațiile pentru materia de clasa a XI-a.</p>
        <div class="soon">În curând</div>
      </div>
    </section>

    <footer class="foot">
      <span>© MateXI · Creat pentru învățare</span>
    </footer>
  </main>
</body>
</html>
